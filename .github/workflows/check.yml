name: Check

# Runs the quality gate (code style and all tests) on every pull request,
# and on main after a merge. The PHP version matches docs/DECISIONS.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: composer check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer packages
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run composer check
        run: composer check
